# Builds installers on each OS. Pushing a tag like v0.2.0 also attaches them to a
# draft GitHub release. Signing is optional: without the secrets below, macOS
# builds are ad-hoc signed and Windows builds are unsigned.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Third-party notices are up to date
        shell: bash
        run: |
          npm run notices
          git diff --exit-code THIRD_PARTY_NOTICES.txt || {
            echo "::error::THIRD_PARTY_NOTICES.txt is stale. Run 'npm run notices' and commit it."
            exit 1
          }
      - run: npx electron-vite build

      # The macOS bundle copies Electron's and Chromium's license files from the
      # Electron package, which npm ci doesn't download by itself.
      - name: Fetch Electron (macOS license files)
        if: matrix.platform == 'mac'
        run: npx install-electron

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          # Developer ID certificate (.p12, base64) and notarization credentials
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never
          else
            echo "No signing certificate; building ad-hoc signed"
            unset CSC_LINK CSC_KEY_PASSWORD
            npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - name: Package (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [ -z "$WIN_CSC_LINK" ] && unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          # One installer per architecture (a combined one is twice the download)
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: markcraft-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
